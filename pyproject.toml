[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-access-orchestrator"
version = "0.1.0"
description = "Cloud Security Portfolio: Identity Lifecycle & Access Orchestration Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "google-cloud-pubsub>=2.20.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "S101", # Allow assert in tests
    "S105", # Allow mock password/token strings in test/demo config
    "S106", # Allow mock password arguments
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101", "S105", "S106"]
